
name: Build TvMenu ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - "HoldableTemplate/HoldableTemplate/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "HoldableTemplate/HoldableTemplate/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android ARM64
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: HoldableTemplate/HoldableTemplate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: HoldableTemplate/HoldableTemplate/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"
          sdkmanager --install "cmake;3.22.1"
          sdkmanager --install "ndk;26.1.10909125"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Build OpenSSL for ARM64
        working-directory: HoldableTemplate/HoldableTemplate/app/src/main/cpp
        env:
          ANDROID_NDK_VERSION: "26.1.10909125"
        shell: bash
        run: |
          set -euxo pipefail

          OPENSSL_PREFIX="$PWD/extern/OpenSSL/arm64-v8a"
          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -d "$NDK"
          sudo apt-get update
          sudo apt-get install -y perl make git

          git clone \
            --depth 1 \
            --branch openssl-3.5.4 \
            https://github.com/openssl/openssl.git \
            /tmp/openssl-src

          cd /tmp/openssl-src

          export ANDROID_NDK_ROOT="$NDK"
          export ANDROID_NDK_HOME="$NDK"
          export PATH="$TOOLCHAIN:$PATH"
          export CC="$TOOLCHAIN/clang"
          export AR="$TOOLCHAIN/llvm-ar"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"

          ./Configure android-arm64 \
            -D__ANDROID_API__=27 \
            no-shared \
            no-tests \
            --prefix="$OPENSSL_PREFIX"

          make -j2 build_libs
          make install_sw

          test -f "$OPENSSL_PREFIX/lib/libcrypto.a"
          test -f "$OPENSSL_PREFIX/lib/libssl.a"

          echo "OpenSSL ARM64 libraries built successfully."

      - name: Inspect and recover missing files from Git history
        shell: bash
        run: |
          set -euxo pipefail

          CPP="app/src/main/cpp"

          echo "=== Search all local Git history for ModMenu.hpp ==="
          git log --all --format='%H' -- \
            '*/ModMenu.hpp' > /tmp/modmenu-commits.txt || true

          while read -r commit; do
            [ -n "$commit" ] || continue

            git ls-tree -r --name-only "$commit" |
              grep -Ei '(^|/)ModMenu\.hpp$' || true
          done < /tmp/modmenu-commits.txt

          echo "=== Current ModMenu.hpp files ==="
          find "$CPP" -type f -iname 'ModMenu.hpp' -print

          echo "=== Search history for RefreshSoundboard ==="
          git log --all -S'RefreshSoundboard' \
            --format='%H' -- \
            'HoldableTemplate/HoldableTemplate/app/src/main/cpp/**' \
            > /tmp/soundboard-commits.txt || true

          while read -r commit; do
            [ -n "$commit" ] || continue

            echo "--- Commit $commit ---"
            git grep -n 'RefreshSoundboard' "$commit" -- \
              'HoldableTemplate/HoldableTemplate/app/src/main/cpp/**' \
              || true
          done < /tmp/soundboard-commits.txt

          echo "=== Tracked menu-related files ==="
          git ls-files '*ModMenu.hpp' '*Buttons.hpp' '*Soundboard*'

          echo "=== Current menu directory ==="
          ls -la "$CPP/Include/Menu"

      - name: Verify OpenSSL
        shell: bash
        run: |
          set -euxo pipefail

          CPP="app/src/main/cpp"

          test -f "$CPP/extern/OpenSSL/arm64-v8a/lib/libcrypto.a"
          test -f "$CPP/extern/OpenSSL/arm64-v8a/lib/libssl.a"

      - name: Build ARM64 debug APK
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x ./gradlew

          ./gradlew --no-daemon assembleDebug \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TvMenu-ARM64-debug
          path: HoldableTemplate/HoldableTemplate/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  
