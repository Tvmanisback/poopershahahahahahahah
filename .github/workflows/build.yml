name: Build TvMenu ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - "HoldableTemplate/HoldableTemplate/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "HoldableTemplate/HoldableTemplate/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android ARM64
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: HoldableTemplate/HoldableTemplate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: HoldableTemplate/HoldableTemplate/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            cmake;3.22.1
            ndk;27.2.12479018

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Verify project files
        run: |
          test -f gradlew
          test -f app/build.gradle
          test -f app/src/main/cpp/CMakeLists.txt
          chmod +x gradlew

      - name: Build ARM64 debug APK
        run: |
          ./gradlew --no-daemon clean assembleDebug \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: Collect APK and native libraries
        if: success()
        working-directory: .
        run: |
          mkdir -p build-output

          find HoldableTemplate/HoldableTemplate/app/build/outputs/apk \
            -type f -name "*.apk" \
            -exec cp {} build-output/ \;

          find HoldableTemplate/HoldableTemplate/app/build \
            -type f -name "*.so" \
            -path "*/arm64-v8a/*" \
            -exec cp {} build-output/ \;

          echo "=== Build artifacts ==="
          ls -lh build-output

          test -n "$(find build-output -type f -name '*.apk' -print -quit)"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TvMenu-ARM64-build
          path: build-output/*
          if-no-files-found: error
          retention-days: 14
