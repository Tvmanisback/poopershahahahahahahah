
name: Build TvMenu ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - "HoldableTemplate/HoldableTemplate/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "HoldableTemplate/HoldableTemplate/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: HoldableTemplate/HoldableTemplate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: HoldableTemplate/HoldableTemplate/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build ARM64 debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: Collect build outputs
        if: success()
        working-directory: .
        run: |
          mkdir -p build-output

          find HoldableTemplate/HoldableTemplate/app/build/outputs/apk \
            -type f -name '*.apk' \
            -exec cp {} build-output/ \;

          find HoldableTemplate/HoldableTemplate/app/build/intermediates \
            -type f -path '*/arm64-v8a/*.so' \
            -exec cp {} build-output/ \;

          ls -lah build-output

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TvMenu-ARM64-build
          path: build-output/*
          if-no-files-found: error
