
name: Build libTvMenu.so ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - "HoldableTemplate/HoldableTemplate/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "HoldableTemplate/HoldableTemplate/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build libTvMenu.so ARM64
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: HoldableTemplate/HoldableTemplate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"
          sdkmanager --install "cmake;3.22.1"
          sdkmanager --install "ndk;26.1.10909125"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Build OpenSSL for ARM64
        working-directory: HoldableTemplate/HoldableTemplate/app/src/main/cpp
        env:
          ANDROID_NDK_VERSION: "26.1.10909125"
        shell: bash
        run: |
          set -euxo pipefail

          OPENSSL_PREFIX="$PWD/extern/OpenSSL/arm64-v8a"
          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          sudo apt-get update
          sudo apt-get install -y perl make git

          git clone \
            --depth 1 \
            --branch openssl-3.5.4 \
            https://github.com/openssl/openssl.git \
            /tmp/openssl-src

          cd /tmp/openssl-src

          export ANDROID_NDK_ROOT="$NDK"
          export ANDROID_NDK_HOME="$NDK"
          export PATH="$TOOLCHAIN:$PATH"
          export CC="$TOOLCHAIN/clang"
          export AR="$TOOLCHAIN/llvm-ar"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"

          ./Configure android-arm64 \
            -D__ANDROID_API__=27 \
            no-shared \
            no-tests \
            --prefix="$OPENSSL_PREFIX"

          make -j2 build_libs
          make install_sw

          test -f "$OPENSSL_PREFIX/lib/libcrypto.a"
          test -f "$OPENSSL_PREFIX/lib/libssl.a"

      - name: Prepare native sources for CI
        shell: bash
        run: |
          set -euxo pipefail

          CPP="app/src/main/cpp"

          test -d "$CPP/Include/Menu"
          test -f "$CPP/native-lib.cpp"
          test -f "$CPP/Include/Menu/Buttons.hpp"

          # Linux paths are case-sensitive. Provide the lowercase include
          # directory referenced by native-lib.cpp without committing it.
          if [ ! -e "$CPP/include" ]; then
            ln -s Include "$CPP/include"
          fi

          # Recover ModMenu.hpp from repository history if it exists there.
          if [ ! -f "$CPP/Include/Menu/ModMenu.hpp" ]; then
            FOUND=0

            while read -r COMMIT; do
              [ -n "$COMMIT" ] || continue

              for FILE in \
                "HoldableTemplate/HoldableTemplate/app/src/main/cpp/Include/Menu/ModMenu.hpp" \
                "HoldableTemplate/HoldableTemplate/app/src/main/cpp/include/Menu/ModMenu.hpp"
              do
                if git cat-file -e "$COMMIT:$FILE" 2>/dev/null; then
                  mkdir -p "$CPP/Include/Menu"
                  git show "$COMMIT:$FILE" > "$CPP/Include/Menu/ModMenu.hpp"
                  FOUND=1
                  break 2
                fi
              done
            done < <(git log --all --format='%H' -- \
              '*/ModMenu.hpp' \
              '*/Menu/ModMenu.hpp')

            if [ "$FOUND" -ne 1 ]; then
              echo "::error::ModMenu.hpp was not found in the working tree or Git history."
              exit 1
            fi
          fi

          # The current Buttons.hpp calls RefreshSoundboard(), but the
          # supplied source does not declare that method. Disable those
          # calls in this temporary CI checkout so the library can compile.
          if grep -q 'Buttons::RefreshSoundboard' "$CPP/Include/Menu/Buttons.hpp"; then
            echo "::warning::Soundboard refresh calls are disabled in this CI build."
            sed -i \
              's/Buttons::RefreshSoundboard();/(void)0;/g' \
              "$CPP/Include/Menu/Buttons.hpp"
          fi

          test -f "$CPP/include/Menu/ModMenu.hpp"

          echo "=== Native source preparation complete ==="

      - name: Verify OpenSSL libraries
        shell: bash
        run: |
          set -euxo pipefail

          CPP="app/src/main/cpp"

          test -f "$CPP/extern/OpenSSL/arm64-v8a/lib/libcrypto.a"
          test -f "$CPP/extern/OpenSSL/arm64-v8a/lib/libssl.a"

      - name: Build ARM64 native library
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x ./gradlew

          ./gradlew --no-daemon externalNativeBuildDebug \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: Locate and rename native library
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p output

          SOURCE="$(find app/build/intermediates \
            -type f \
            -name 'librayvo.so' \
            -print \
            -quit)"

          if [ -z "$SOURCE" ]; then
            echo "::error::librayvo.so was not generated."
            echo "Check the native CMake compilation errors above."
            exit 1
          fi

          cp "$SOURCE" output/libTvMenu.so

          file output/libTvMenu.so

          readelf -h output/libTvMenu.so |
            grep -E 'Class:|Machine:'

          test -s output/libTvMenu.so

      - name: Upload libTvMenu.so
        uses: actions/upload-artifact@v4
        with:
          name: libTvMenu-ARM64
          path: HoldableTemplate/HoldableTemplate/output/libTvMenu.so
          if-no-files-found: error
          retention-days: 14
