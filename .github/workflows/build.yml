
name: Build TvMenu ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - "HoldableTemplate/HoldableTemplate/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "HoldableTemplate/HoldableTemplate/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android ARM64
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: HoldableTemplate/HoldableTemplate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: HoldableTemplate/HoldableTemplate/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"
          sdkmanager --install "cmake;3.22.1"
          sdkmanager --install "ndk;27.2.12479018"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Build OpenSSL for ARM64
        working-directory: HoldableTemplate/HoldableTemplate/app/src/main/cpp
        env:
          ANDROID_NDK_VERSION: "27.2.12479018"
        shell: bash
        run: |
          set -euxo pipefail

          OPENSSL_DIR="$PWD/extern/OpenSSL"
          OPENSSL_PREFIX="$OPENSSL_DIR/arm64-v8a"
          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -d "$NDK"
          test -x "$TOOLCHAIN/clang"
          test -x "$TOOLCHAIN/llvm-ar"
          test -x "$TOOLCHAIN/llvm-ranlib"

          sudo apt-get update
          sudo apt-get install -y perl make git

          git clone \
            --depth 1 \
            --branch openssl-3.5.4 \
            https://github.com/openssl/openssl.git \
            /tmp/openssl-src

          cd /tmp/openssl-src

          export ANDROID_NDK_ROOT="$NDK"
          export ANDROID_NDK_HOME="$NDK"
          export PATH="$TOOLCHAIN:$PATH"
          export CC="$TOOLCHAIN/clang"
          export AR="$TOOLCHAIN/llvm-ar"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"

          ./Configure android-arm64 \
            -D__ANDROID_API__=27 \
            no-shared \
            no-tests \
            --prefix="$OPENSSL_PREFIX"

          make -j2 build_libs
          make install_sw

          test -f "$OPENSSL_PREFIX/lib/libcrypto.a"
          test -f "$OPENSSL_PREFIX/lib/libssl.a"

          echo "OpenSSL ARM64 libraries built successfully."
          ls -lh "$OPENSSL_PREFIX/lib/"

      - name: Verify project files
        shell: bash
        run: |
          set -euxo pipefail

          test -f gradlew
          test -f app/build.gradle
          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/extern/OpenSSL/arm64-v8a/lib/libcrypto.a
          test -f app/src/main/cpp/extern/OpenSSL/arm64-v8a/lib/libssl.a

          chmod +x gradlew

      - name: Build ARM64 debug APK
        shell: bash
        run: |
          set -euxo pipefail

          ./gradlew --no-daemon clean assembleDebug \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: Collect build artifacts
        if: success()
        working-directory: .
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p build-output

          find HoldableTemplate/HoldableTemplate/app/build/outputs/apk \
            -type f -name "*.apk" \
            -exec cp {} build-output/ \;

          find HoldableTemplate/HoldableTemplate/app/build \
            -type f -name "*.so" \
            -path "*/arm64-v8a/*" \
            -exec cp {} build-output/ \;

          echo "=== Build artifacts ==="
          ls -lh build-output

          test -n "$(find build-output -type f -name '*.apk' -print -quit)"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TvMenu-ARM64-build
          path: build-output/*
          if-no-files-found: error
          retention-days: 14
